<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Thumbnail starter</title>
  <link rel="stylesheet" href="../../brand/tokens.css">
  <link rel="stylesheet" href="../../brand.local/tokens.css">
  <style>
    html, body { margin: 0; }
    .frame {
      box-sizing: border-box;
      width: 1280px;
      height: 720px;
      padding: var(--space-safe, 0px);
      background: var(--color-bg, transparent);
      color: var(--color-fg, CanvasText);
      font-family: var(--font-sans, sans-serif);
    }
    h1 { font-size: var(--size-title, 2rem); margin: var(--space-block, 0px) 0; }
  </style>
</head>
<body>
  <!-- Optional starter. 1280 by 720 is a size you can change. Use your own words. -->
  <!-- A face on this frame comes only from a photo the owner supplied. -->
  <article class="frame">
    <h1>Your title</h1>
    <p>Your thumbnail text.</p>
  </article>
</body>
</html>
