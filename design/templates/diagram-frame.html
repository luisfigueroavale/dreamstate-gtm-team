<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Diagram frame starter</title>
  <link rel="stylesheet" href="../tokens.css">
  <link rel="stylesheet" href="../tokens.local.css">
  <style>
    html, body { margin: 0; }
    .frame {
      box-sizing: border-box;
      width: 1280px;
      height: 720px;
      padding: var(--space-safe, 0px);
      background: var(--color-bg, transparent);
      color: var(--color-fg, CanvasText);
      font-family: var(--font-sans, sans-serif);
    }
    .slot { width: 100%; height: 100%; }
    .slot svg { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <!-- Optional starter. 1280 by 720 matches the thumbnail starter. Change it if you want. -->
  <!-- Paste an SVG you rendered on your machine. Keep the Mermaid text local. -->
  <article class="frame">
    <div class="slot"></div>
  </article>
</body>
</html>
