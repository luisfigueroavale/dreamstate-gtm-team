<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Quote or stat card starter</title>
  <link rel="stylesheet" href="../../brand/tokens.css">
  <link rel="stylesheet" href="../../brand.local/tokens.css">
  <style>
    html, body { margin: 0; }
    .frame {
      box-sizing: border-box;
      width: 1080px;
      height: 1080px;
      padding: var(--space-safe, 0px);
      background: var(--color-bg, transparent);
      color: var(--color-fg, CanvasText);
      font-family: var(--font-sans, sans-serif);
      font-size: var(--size-body, 1rem);
    }
    blockquote { font-size: var(--size-title, 2rem); margin: var(--space-block, 0px) 0; }
    .figure { font-size: var(--size-title, 2rem); color: var(--color-accent, CanvasText); }
  </style>
</head>
<body>
  <!-- Optional starter. Same square size as single-image-square.html. Change it if you want. -->
  <article class="frame">
    <blockquote>Your quote</blockquote>
    <p class="figure">Your figure</p>
    <p>Name the source of the figure, or remove the figure.</p>
  </article>
</body>
</html>
