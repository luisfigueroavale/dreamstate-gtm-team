<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Carousel slide starter</title>
  <link rel="stylesheet" href="../../brand/tokens.css">
  <link rel="stylesheet" href="../../brand.local/tokens.css">
  <style>
    html, body { margin: 0; }
    .frame {
      box-sizing: border-box;
      width: 1080px;
      height: 1350px;
      padding: var(--space-safe, 0px);
      background: var(--color-bg, transparent);
      color: var(--color-fg, CanvasText);
      font-family: var(--font-sans, sans-serif);
      font-size: var(--size-body, 1rem);
    }
    .kicker { font-size: var(--size-kicker, 0.8rem); color: var(--color-muted, CanvasText); }
    h1 { font-size: var(--size-title, 2rem); margin: var(--space-block, 0px) 0; }
    .logo { max-height: var(--logo-max-height, none); }
  </style>
</head>
<body>
  <!-- Optional starter. 1080 by 1350 is a size you can change. Use your own words. -->
  <article class="frame">
    <p class="kicker">Your label</p>
    <h1>Your headline</h1>
    <p>Your text. Leave a figure out unless you can name its source.</p>
    <p class="logo">Your logo, if you supply a file</p>
  </article>
</body>
</html>
